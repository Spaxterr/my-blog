services:
  postgres:
    image: paradedb/paradedb:pg18
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: my_blog
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql]
    deploy:
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:8-alpine
    deploy:
      placement:
        constraints: [node.role == manager]

  caddy:
    image: ${IMAGE_PREFIX:-my-blog}/caddy:${TAG:-latest}
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?set DOMAIN_NAME in .env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      placement:
        constraints: [node.role == manager]

  auth:
    image: ${IMAGE_PREFIX:-my-blog}/auth:${TAG:-latest}
    environment:
      BETTER_AUTH_URL: https://${DOMAIN_NAME:?set DOMAIN_NAME in .env}
      WEB_HOST: https://${DOMAIN_NAME}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - source: auth_database_url
        target: database_url
      - source: auth_redis_url
        target: redis_url
      - source: auth_discord_client_id
        target: discord_client_id
      - source: auth_discord_client_secret
        target: discord_client_secret
      - source: auth_github_client_id
        target: github_client_id
      - source: auth_github_client_secret
        target: github_client_secret
      - source: auth_secret
        target: secret
    deploy:
      replicas: ${REPLICAS:-2}
      update_config: { order: start-first }

  blog-posts:
    image: ${IMAGE_PREFIX:-my-blog}/blog-posts:${TAG:-latest}
    environment:
      HOST: 0.0.0.0:3000
      AUTH_HOST: http://auth:3001
    secrets:
      - source: blog_database_url
        target: database_url
    deploy:
      replicas: ${REPLICAS:-2}
      update_config: { order: start-first }

  web:
    image: ${IMAGE_PREFIX:-my-blog}/web:${TAG:-latest}
    environment:
      BLOG_POSTS_HOST: http://blog-posts:3000
      AUTH_HOST: https://${DOMAIN_NAME}
      AUTH_INTERNAL_HOST: http://auth:3001
    deploy:
      replicas: ${REPLICAS:-2}
      update_config: { order: start-first }

  miasma:
    image: austinweeks/miasma:latest
    command: ["--link-prefix", "/gift-pit", "--max-in-flight", "30"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

secrets:
  postgres_password: { external: true, name: my-blog_postgres_password }
  auth_database_url: { external: true, name: my-blog_auth_database_url }
  auth_redis_url: { external: true, name: my-blog_auth_redis_url }
  auth_discord_client_id: { external: true, name: my-blog_auth_discord_client_id }
  auth_discord_client_secret: { external: true, name: my-blog_auth_discord_client_secret }
  auth_github_client_id: { external: true, name: my-blog_auth_github_client_id }
  auth_github_client_secret: { external: true, name: my-blog_auth_github_client_secret }
  auth_secret: { external: true, name: my-blog_auth_secret }
  blog_database_url: { external: true, name: my-blog_blog_database_url }
