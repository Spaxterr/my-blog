services:
  postgres:
    image: paradedb/paradedb:pg18
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: my_blog
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql]
    deploy:
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:8-alpine
    deploy:
      placement:
        constraints: [node.role == manager]

  auth:
    image: ${IMAGE_PREFIX:-my-blog}/auth:${TAG:-latest}
    environment:
      BETTER_AUTH_URL: ${AUTH_ORIGIN:?set AUTH_ORIGIN in .env}
      WEB_HOST: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - source: auth_database_url
        target: database_url
      - source: auth_redis_url
        target: redis_url
      - source: auth_discord_client_id
        target: discord_client_id
      - source: auth_discord_client_secret
        target: discord_client_secret
      - source: auth_github_client_id
        target: github_client_id
      - source: auth_github_client_secret
        target: github_client_secret
      - source: auth_secret
        target: secret
    ports: ["${AUTH_PORT:-3001}:3001"]
    deploy:
      replicas: ${REPLICAS:-2}
      update_config: { order: start-first }

  blog-posts:
    image: ${IMAGE_PREFIX:-my-blog}/blog-posts:${TAG:-latest}
    environment:
      HOST: 0.0.0.0:3000
      AUTH_HOST: http://auth:3001
    secrets:
      - source: blog_database_url
        target: database_url
    deploy:
      replicas: ${REPLICAS:-2}
      update_config: { order: start-first }

  web:
    image: ${IMAGE_PREFIX:-my-blog}/web:${TAG:-latest}
    environment:
      BLOG_POSTS_HOST: http://blog-posts:3000
      AUTH_HOST: ${AUTH_ORIGIN:?set AUTH_ORIGIN in .env}
      AUTH_INTERNAL_HOST: http://auth:3001
    ports: ["${WEB_PORT:-80}:3004"]
    deploy:
      replicas: ${REPLICAS:-2}
      update_config: { order: start-first }

volumes:
  pgdata:

secrets:
  postgres_password: { external: true }
  auth_database_url: { external: true }
  auth_redis_url: { external: true }
  auth_discord_client_id: { external: true }
  auth_discord_client_secret: { external: true }
  auth_github_client_id: { external: true }
  auth_github_client_secret: { external: true }
  auth_secret: { external: true }
  blog_database_url: { external: true }
