[package]
name = "blog-posts"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
blog-contracts = { path = "../../packages/contracts/rust" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "time"] }
dotenvy = "0.15.7"
uuid = { version =  "1.26.0", features = ["v7", "fast-rng"] }
serde = "1.0.229"
comrak = "0.54.0"
two-face = { version = "0.5.2", features = ["syntect-fancy"] }
serde_json = "1.0.151"
jsonschema = { version = "0.53.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
todo = "deny"
needless_return = "allow"
implicit_return = "warn"
