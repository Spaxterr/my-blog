<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog API — Swagger</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
  </head>
  <body>
    <div id="swagger"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      // Relative on purpose: resolves to /openapi.json when hit directly and to
      // /api/blog/openapi.json behind Caddy's prefix mount.
      SwaggerUIBundle({ url: "openapi.json", dom_id: "#swagger" });
    </script>
  </body>
</html>
